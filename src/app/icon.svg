<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- ═══ BASE ═══ -->
  <circle cx="100" cy="100" r="100" fill="#fff"/>

  <!-- Outer green ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#0a4a2e" stroke-width="8"/>
  <!-- Gold inner ring -->
  <circle cx="100" cy="100" r="87.5" fill="none" stroke="#C9A84C" stroke-width="2"/>

  <!-- ═══ LEFT MINARET (centred x=35) ═══ -->
  <!-- Spire -->
  <polygon points="35,50 37.5,63 32.5,63" fill="#0a4a2e"/>
  <circle cx="35" cy="50" r="1.8" fill="#C9A84C"/>
  <!-- Dome cap -->
  <ellipse cx="35" cy="63" rx="6" ry="3.5" fill="#0a4a2e"/>
  <!-- Upper shaft -->
  <rect x="32" y="63" width="6" height="15" fill="#0a4a2e"/>
  <!-- Gold balcony band -->
  <rect x="28.5" y="76.5" width="13" height="2.5" fill="#C9A84C"/>
  <!-- Mid shaft -->
  <rect x="30" y="79" width="10" height="18" fill="#0a4a2e"/>
  <!-- Gold platform band -->
  <rect x="26.5" y="95.5" width="17" height="2.5" fill="#C9A84C"/>
  <!-- Base column -->
  <rect x="28" y="98" width="14" height="34" fill="#0a4a2e"/>

  <!-- ═══ RIGHT MINARET (centred x=165) ═══ -->
  <polygon points="165,50 167.5,63 162.5,63" fill="#0a4a2e"/>
  <circle cx="165" cy="50" r="1.8" fill="#C9A84C"/>
  <ellipse cx="165" cy="63" rx="6" ry="3.5" fill="#0a4a2e"/>
  <rect x="162" y="63" width="6" height="15" fill="#0a4a2e"/>
  <rect x="158.5" y="76.5" width="13" height="2.5" fill="#C9A84C"/>
  <rect x="160" y="79" width="10" height="18" fill="#0a4a2e"/>
  <rect x="156.5" y="95.5" width="17" height="2.5" fill="#C9A84C"/>
  <rect x="158" y="98" width="14" height="34" fill="#0a4a2e"/>

  <!-- ═══ MIHRAB ARCH ═══ -->
  <!-- Outer arch stroke (green 5px) -->
  <path d="M 50,132 L 50,78 C 50,28 100,15 100,15 C 100,15 150,28 150,78 L 150,132"
        fill="none" stroke="#0a4a2e" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Gold inner accent (1.8px) -->
  <path d="M 55,131 L 55,80 C 55,34 100,21 100,21 C 100,21 145,34 145,80 L 145,131"
        fill="none" stroke="#C9A84C" stroke-width="1.8"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ═══ CRESCENT MOON & STAR ═══ -->
  <!-- Gold crescent -->
  <circle cx="97" cy="38" r="11.5" fill="#C9A84C"/>
  <circle cx="103" cy="34.5" r="9.5" fill="#fff"/>
  <!-- Five-point star -->
  <polygon
    points="114,31 115.4,35.4 120,35.4 116.5,38 117.8,42.4 114,39.8 110.2,42.4 111.5,38 108,35.4 112.6,35.4"
    fill="#C9A84C"/>

  <!-- ═══ OPEN QUR'AN ═══ -->
  <!-- Left cover (dark green) -->
  <path d="M 67,114 C 67,84 83,63 100,60 L 100,114 Z" fill="#0a4a2e"/>
  <!-- Left white page -->
  <path d="M 70.5,113 C 70.5,85 84,66 99.5,63 L 99.5,113 Z" fill="#fff"/>
  <!-- Left page gold lines -->
  <line x1="75" y1="80" x2="98" y2="77" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="75" y1="86" x2="98" y2="83" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="75" y1="92" x2="98" y2="89" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="76" y1="98" x2="98" y2="95" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="77" y1="104" x2="98" y2="102" stroke="#C9A84C" stroke-width="0.9"/>
  <!-- Right cover (dark green) -->
  <path d="M 133,114 C 133,84 117,63 100,60 L 100,114 Z" fill="#0a4a2e"/>
  <!-- Right white page -->
  <path d="M 129.5,113 C 129.5,85 116,66 100.5,63 L 100.5,113 Z" fill="#fff"/>
  <!-- Right page gold lines -->
  <line x1="125" y1="80" x2="102" y2="77" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="125" y1="86" x2="102" y2="83" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="125" y1="92" x2="102" y2="89" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="124" y1="98" x2="102" y2="95" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="123" y1="104" x2="102" y2="102" stroke="#C9A84C" stroke-width="0.9"/>
  <!-- Gold spine -->
  <line x1="100" y1="60" x2="100" y2="114" stroke="#C9A84C" stroke-width="2"/>
  <!-- Bottom curved edge -->
  <path d="M 67,114 Q 100,119 133,114" fill="none" stroke="#0a4a2e" stroke-width="1.5"/>

  <!-- ═══ REHAL (Qur'an stand) ═══ -->
  <!-- Top shelf -->
  <line x1="82" y1="114" x2="118" y2="114" stroke="#0a4a2e" stroke-width="2" stroke-linecap="round"/>
  <!-- X-frame legs -->
  <line x1="82" y1="114" x2="93" y2="131" stroke="#0a4a2e" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="118" y1="114" x2="107" y2="131" stroke="#0a4a2e" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="93" y1="114" x2="82" y2="131" stroke="#0a4a2e" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="107" y1="114" x2="118" y2="131" stroke="#0a4a2e" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Bottom bar -->
  <line x1="79" y1="131" x2="121" y2="131" stroke="#0a4a2e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ═══ GOLD ARC SEPARATOR ═══ -->
  <path d="M 60,137 Q 100,146 140,137" fill="none" stroke="#C9A84C" stroke-width="1.5"/>

  <!-- ═══ A & M ═══ -->
  <text x="80" y="156"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="21" font-weight="900" fill="#0a4a2e">A</text>
  <text x="100" y="155"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="14" fill="#C9A84C">&amp;</text>
  <text x="120" y="156"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="21" font-weight="900" fill="#0a4a2e">M</text>

  <!-- Decorative gold dashes flanking lower text -->
  <line x1="38" y1="161" x2="62" y2="161" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="138" y1="161" x2="162" y2="161" stroke="#C9A84C" stroke-width="0.9"/>

  <!-- ═══ ALIYU & MAIMUNA ═══ -->
  <text x="100" y="167"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="7.8" font-weight="700" fill="#0a4a2e"
        letter-spacing="0.4">ALIYU &amp; MAIMUNA</text>

  <!-- Thin gold rule -->
  <line x1="54" y1="171" x2="146" y2="171" stroke="#C9A84C" stroke-width="0.6"/>

  <!-- ═══ CENTRE ═══ -->
  <text x="100" y="179"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="6.8" font-weight="700" fill="#0a4a2e"
        letter-spacing="2.8">CENTRE</text>

</svg>
