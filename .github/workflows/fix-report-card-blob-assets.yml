name: Fix report card blob assets

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add explicit base URL to generated report HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/reports/page.tsx')
          text = p.read_text()
          old_sig = "function buildFullPageHTML(title: string, bodyHTML: string, autoPrint = false): string {"
          new_sig = "function buildFullPageHTML(title: string, bodyHTML: string, autoPrint = false, baseHref = ''): string {"
          if old_sig not in text:
              raise SystemExit('buildFullPageHTML signature marker not found')
          text = text.replace(old_sig, new_sig, 1)
          old_return = "return `<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>${title}</title><style>${PRINT_CSS}</style></head><body>${bodyHTML}${printScript}</body></html>`;"
          new_return = "return `<!DOCTYPE html><html><head><meta charset=\"utf-8\"><base href=\"${baseHref || '/'}\"><title>${title}</title><style>${PRINT_CSS}</style></head><body>${bodyHTML}${printScript}</body></html>`;"
          if old_return not in text:
              raise SystemExit('buildFullPageHTML return marker not found')
          text = text.replace(old_return, new_return, 1)
          old_open = "const html = buildFullPageHTML(title, bodyHTML, true);"
          new_open = "const html = buildFullPageHTML(title, bodyHTML, true, `${window.location.origin}/`);"
          if old_open not in text:
              raise SystemExit('openPrintWindow marker not found')
          text = text.replace(old_open, new_open, 1)
          old_preview = "const html=buildFullPageHTML(`Report Card · ${student.name}`,body);"
          new_preview = "const html=buildFullPageHTML(`Report Card · ${student.name}`,body,false,`${window.location.origin}/`);"
          if old_preview not in text:
              raise SystemExit('preview marker not found')
          text = text.replace(old_preview, new_preview, 1)
          p.write_text(text)
          print('Report HTML now has an explicit base URL for static assets.')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/reports/page.tsx
          git diff --cached --quiet || git commit -m "Fix report card Quran image in blob preview"
          git push
          rm -f .github/workflows/fix-report-card-blob-assets.yml
          git add -u .github/workflows/fix-report-card-blob-assets.yml
          git commit -m "Remove blob asset fix helper" || true
          git push || true
