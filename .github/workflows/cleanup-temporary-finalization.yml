name: Cleanup temporary finalization tooling
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary patch tooling
        run: |
          git rm -f \
            scripts/finalize-teacher-quran-source.mjs \
            scripts/fix-teacher-quran-syntax.mjs \
            scripts/repair-teacher-dashboard-structure.mjs \
            scripts/cleanup-teacher-dashboard-duplicates.mjs \
            scripts/final-teacher-build-fix.mjs \
            .github/workflows/finalize-teacher-quran.yml \
            .github/workflows/fix-teacher-quran-syntax.yml \
            .github/workflows/repair-teacher-dashboard.yml \
            .github/workflows/cleanup-teacher-dashboard.yml \
            .github/workflows/final-teacher-build-fix.yml \
            .github/workflows/verify-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary teacher patch tooling"
          git push
