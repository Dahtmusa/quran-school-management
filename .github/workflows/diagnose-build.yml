name: Diagnose build
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and capture log
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          echo "BUILD_EXIT_CODE=$code" >> build.log
          exit $code
      - name: Lint (informational; repository has no ESLint 9 flat config yet)
        continue-on-error: true
        run: npm run lint
      - name: ID card Arabic QA
        run: npm run qa:id-card
      - name: Static QA
        run: npm run qa:static
      - name: Lifecycle QA
        run: npm run qa:lifecycle
      - name: Operational QA
        run: npm run qa:operational
      - name: Production audit QA
        run: npm run qa:production-audit
      - name: Academic autopilot QA
        run: npm run qa:academic-autopilot
      - name: System consistency QA
        run: npm run qa:system-consistency
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
