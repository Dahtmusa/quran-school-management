name: Diagnose build
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One-time A4 report card typography update
        if: ${{ github.event.head_commit.message == 'chore: trigger report card typography update' }}
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/app/reports/page.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('const PRINT_CSS = `')
          end = text.index('`;\n\nfunction buildFullPageHTML', start)
          css = text[start:end]

          def bump(match: re.Match[str]) -> str:
              raw = float(match.group(1))
              if raw <= 5.5:
                  factor = 1.28
              elif raw <= 7.0:
                  factor = 1.20
              elif raw <= 10.0:
                  factor = 1.16
              else:
                  factor = 1.10
              value = round(raw * factor, 1)
              return f'font-size:{value:g}px'

          css = re.sub(r'font-size:(\d+(?:\.\d+)?)px', bump, css)
          css = css.replace(
              'padding:6mm 6.5mm 0;display:flex;flex-direction:column;gap:2.4mm;',
              'padding:5.5mm 6.5mm 0;display:flex;flex-direction:column;gap:2mm;',
          )
          css = css.replace(
              'grid-template-columns:1fr 44mm;gap:2.5mm;',
              'grid-template-columns:1fr 44mm;gap:2mm;',
          )
          text = text[:start] + css + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit one-time typography update
        if: ${{ github.event.head_commit.message == 'chore: trigger report card typography update' }}
        shell: bash
        run: |
          grep -q '@page{size:A4 portrait;margin:0}' src/app/reports/page.tsx
          grep -q '.page{width:210mm;height:297mm;' src/app/reports/page.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/reports/page.tsx
          git commit -m 'chore: increase A4 report card typography'
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and capture log
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          echo "BUILD_EXIT_CODE=$code" >> build.log
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
