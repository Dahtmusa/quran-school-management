name: Apply teacher controls patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-teacher-student-controls.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-teacher-student-controls.mjs
      - name: Commit patched application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/teacher/page.tsx src/lib/live-store.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add teacher Quran profile and student status controls"
          git push
      - name: Remove patch tooling
        if: success()
        run: |
          rm -f scripts/patch-teacher-student-controls.mjs .github/workflows/apply-teacher-controls-patch.yml
          git add scripts/patch-teacher-student-controls.mjs .github/workflows/apply-teacher-controls-patch.yml
          git commit -m "Remove temporary teacher controls patch tooling"
          git push
