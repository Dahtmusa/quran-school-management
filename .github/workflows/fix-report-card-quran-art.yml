name: Fix report card Quran artwork

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inline Quran artwork for blob report preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          report = Path('src/app/reports/page.tsx')
          art = Path('public/report-card/quran-art.webp')
          text = report.read_text()
          raw = base64.b64encode(art.read_bytes()).decode('ascii')
          data_url = 'data:image/webp;base64,' + raw

          pattern = r"const quranArtUrl = .*?;"
          replacement = "const quranArtUrl = %r;" % data_url
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('quranArtUrl marker not found')

          report.write_text(text)
          print(f'Inlined Quran artwork: {len(raw)} base64 chars')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/reports/page.tsx
          git diff --cached --quiet || git commit -m "Fix report card Quran artwork rendering"
          git push
          rm -f .github/workflows/fix-report-card-quran-art.yml
          git add -u .github/workflows/fix-report-card-quran-art.yml
          git commit -m "Remove Quran art fix helper" || true
          git push || true
