name: Cleanup report card attendance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove attendance from student report cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/reports/page.tsx')
          s = p.read_text()
          old = '''      <section class="rc-attendance">\n        <div class="rc-att-title">Attendance</div>\n        <div class="rc-att-value">${s.attendance != null ? `${s.attendance}%` : '—'}</div>\n        <div class="rc-status">${status}</div>\n      </section>'''
          new = '''      <section class="rc-status-card">\n        <div class="rc-att-title">Academic Standing</div>\n        <div class="rc-att-value">${status}</div>\n        <div class="rc-status">${approved.length} of 3 evaluations approved</div>\n      </section>'''
          if old in s:
              s = s.replace(old, new, 1)
          old2 = '''</div><div class="rc-final-att"><span>ATTENDANCE</span><b>${s.attendance != null ? `${s.attendance}%` : '—'}</b></div>'''
          s = s.replace(old2, '</div>', 1)
          s = s.replace('.rc-student-card,.rc-attendance{border:', '.rc-student-card,.rc-status-card{border:', 1)
          s = s.replace('.rc-attendance{padding:3mm;text-align:center;display:flex;flex-direction:column;justify-content:center}', '.rc-status-card{padding:3mm;text-align:center;display:flex;flex-direction:column;justify-content:center}', 1)
          s = s.replace('.rc-final-body{display:grid;grid-template-columns:1fr .75fr 1.25fr .55fr;', '.rc-final-body{display:grid;grid-template-columns:1fr .75fr 1.5fr;', 1)
          start = s.find('.rc-final-att{text-align:center;')
          if start != -1:
              end = s.find('}', start)
              if end != -1:
                  # remove the three compact CSS rules belonging to final attendance
                  end = s.find('}', s.find('}', s.find('}', start)+1)+1)
                  s = s[:start] + s[end+1:]
          p.write_text(s)
          PY
          if git diff --quiet -- src/app/reports/page.tsx; then
            echo 'No report-card attendance changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/reports/page.tsx
          git commit -m 'Remove unrecorded attendance from report cards'
          git push
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Remove cleanup workflow
        if: success()
        run: |
          git rm .github/workflows/cleanup-report-attendance.yml
          git commit -m 'Remove report card cleanup helper'
          git push
