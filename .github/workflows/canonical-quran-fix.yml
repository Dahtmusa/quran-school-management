name: Canonical Quran source fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch application source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/lib/live-store.ts')
          s=p.read_text()
          s=s.replace("supabase().rpc('admin_get_student_directory')", "supabase().rpc('get_school_student_directory')", 1)
          start=s.index('export async function loadTeacherDirectory()')
          end=s.index('export async function teacherUpdateStudentQuranProfile', start)
          replacement='''export async function loadTeacherDirectory() {\n  const { data, error } = await supabase().rpc('get_school_student_directory');\n  if (error || !data) { console.error('Teacher directory load failed:', error); return []; }\n  return (data as any[]).map((r:any) => ({\n    id:r.student_id ?? r.id, admissionNo:r.admission_no, name:r.full_name, dateOfBirth:r.date_of_birth, gender:r.gender,\n    section:r.section === 'boarding' ? 'Boarding' : 'Day', year:r.program_year === 'year_2' ? 'Year 2' : 'Year 1', status:r.status,\n    photoUrl:r.photo_url ?? null, start:{surah:r.start_surah ?? 114,ayah:r.start_ayah ?? 1},\n    current:{surah:r.current_surah ?? r.start_surah ?? 114,ayah:r.current_ayah ?? 1,page:r.current_page,hizb:r.current_hizb},\n    direction:r.memorization_direction === 'nas_to_baqarah' ? 'Nas-to-Baqarah' : 'Baqarah-to-Nas',\n    className:r.class_name ?? null, classId:r.class_id ?? null, progressPercent:Number(r.progress_percent ?? 0),\n    parent:{name:r.parent_name,phone:r.parent_phone,relationship:r.parent_relationship},\n  }));\n}\n\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path('src/app/teacher/page.tsx')
          s=p.read_text()
          s=s.replace("import { SURAHS, label, absoluteProgress, calculateEvaluation } from '@/lib/quran';", "import { SURAHS, label, progressBetween, calculateEvaluation } from '@/lib/quran';")
          old="const canonicalProgress = absoluteProgress({ surah: currSurahId, ayah: Number(s.current?.ayah || 1) }, s.direction);"
          new="const canonicalProgress = progressBetween({ surah: startSurahId, ayah: Number(s.start?.ayah || 1) }, { surah: currSurahId, ayah: Number(s.current?.ayah || 1) }, s.direction);"
          if old not in s: raise SystemExit('teacher progress target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/components/QuranProgress.tsx')
          s=p.read_text()
          s=s.replace("const s=studentStats(student); const pct=Math.min(100,Math.max(0,s.percent));", "const s=studentStats(student); const journey=s.memorizationFromStart; const pct=Math.min(100,Math.max(0,journey.percent));")
          s=s.replace("{pct.toFixed(1)}% of the Qur'an · {s.hizbs.toFixed(1)} / 60 Hizb", "{pct.toFixed(1)}% of this student's Hifz journey · {journey.hizbs.toFixed(1)} Hizb")
          s=s.replace("value={s.ayahs.toLocaleString()}", "value={journey.ayahs.toLocaleString()}", 1)
          s=s.replace("value={s.pages.toLocaleString()}", "value={journey.pages.toLocaleString()}", 1)
          s=s.replace("value={`${s.hizbs.toFixed(1)} / 60`}", "value={`${journey.hizbs.toFixed(1)}`}", 1)
          p.write_text(s)
          PY
      - name: Commit and remove patch workflow
        run: |
          git rm -f .github/workflows/canonical-quran-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/live-store.ts src/app/teacher/page.tsx src/components/QuranProgress.tsx
          git commit -m "Use one canonical Quran source across dashboards"
          git push