name: Repair teacher Quran editor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[teacher-quran-ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add start position fields to teacher My Students editor
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/teacher/students/page.tsx')
          text = path.read_text(encoding='utf-8')

          old_state = "  const [edit, setEdit] = useState<any|null>(null);\n  const [busy, setBusy] = useState(false);"
          new_state = "  const [edit, setEdit] = useState<any|null>(null);\n  const [busy, setBusy] = useState(false);"
          if old_state not in text:
              raise SystemExit('Expected state block not found')

          old_save = "      await teacherUpdateStudentQuranProfile(edit.id, { direction: edit.direction, currentSurah: Number(edit.current_surah), currentAyah: Number(edit.current_ayah) });"
          new_save = "      await teacherUpdateStudentQuranProfile(edit.id, { direction: edit.direction, startSurah: Number(edit.start_surah), startAyah: Number(edit.start_ayah), currentSurah: Number(edit.current_surah), currentAyah: Number(edit.current_ayah) });"
          if old_save not in text:
              raise SystemExit('Expected save call not found')
          text = text.replace(old_save, new_save, 1)

          old_open = "onClick={()=>setEdit({...s,direction:s.direction==='Baqarah-to-Nas'?'baqarah_to_nas':'nas_to_baqarah',current_surah:Number(s.current?.surah||s.start?.surah||2),current_ayah:Number(s.current?.ayah||1),name:s.name,admissionNo:s.admissionNo})}"
          new_open = "onClick={()=>setEdit({...s,direction:s.direction==='Baqarah-to-Nas'?'baqarah_to_nas':'nas_to_baqarah',start_surah:Number(s.start?.surah||114),start_ayah:Number(s.start?.ayah||1),current_surah:Number(s.current?.surah||s.start?.surah||114),current_ayah:Number(s.current?.ayah||1),name:s.name,admissionNo:s.admissionNo})}"
          if old_open not in text:
              raise SystemExit('Expected edit-open handler not found')
          text = text.replace(old_open, new_open, 1)

          old_modal = '''<div className="mt-5 grid gap-4 sm:grid-cols-3"><label className="text-xs font-black uppercase tracking-wide text-slate-500">Direction<select className="input mt-1 w-full" value={edit.direction} onChange={e=>setEdit({...edit,direction:e.target.value})}><option value="baqarah_to_nas">Baqarah → Nas</option><option value="nas_to_baqarah">Nas → Baqarah</option></select></label><label className="text-xs font-black uppercase tracking-wide text-slate-500">Current Surah<select className="input mt-1 w-full" value={edit.current_surah} onChange={e=>setEdit({...edit,current_surah:Number(e.target.value),current_ayah:1})}>{SURAHS.map(x=><option key={x.id} value={x.id}>{x.id}. {x.name}</option>)}</select></label><label className="text-xs font-black uppercase tracking-wide text-slate-500">Current Ayah<select className="input mt-1 w-full" value={edit.current_ayah} onChange={e=>setEdit({...edit,current_ayah:Number(e.target.value)})}>{Array.from({length:SURAHS.find(x=>x.id===Number(edit.current_surah))?.ayahs||286},(_,i)=>i+1).map(n=><option key={n} value={n}>{n}</option>)}</select></label></div>'''
          new_modal = '''<div className="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"><label className="text-xs font-black uppercase tracking-wide text-slate-500">Direction<select className="input mt-1 w-full" value={edit.direction} onChange={e=>setEdit({...edit,direction:e.target.value})}><option value="baqarah_to_nas">Baqarah → Nas</option><option value="nas_to_baqarah">Nas → Baqarah</option></select></label><label className="text-xs font-black uppercase tracking-wide text-slate-500">Starting Surah<select className="input mt-1 w-full" value={edit.start_surah} onChange={e=>setEdit({...edit,start_surah:Number(e.target.value),start_ayah:1})}>{SURAHS.map(x=><option key={x.id} value={x.id}>{x.id}. {x.name}</option>)}</select></label><label className="text-xs font-black uppercase tracking-wide text-slate-500">Starting Ayah<select className="input mt-1 w-full" value={edit.start_ayah} onChange={e=>setEdit({...edit,start_ayah:Number(e.target.value)})}>{Array.from({length:SURAHS.find(x=>x.id===Number(edit.start_surah))?.ayahs||286},(_,i)=>i+1).map(n=><option key={n} value={n}>{n}</option>)}</select></label><label className="text-xs font-black uppercase tracking-wide text-slate-500">Current Surah<select className="input mt-1 w-full" value={edit.current_surah} onChange={e=>setEdit({...edit,current_surah:Number(e.target.value),current_ayah:1})}>{SURAHS.map(x=><option key={x.id} value={x.id}>{x.id}. {x.name}</option>)}</select></label><label className="text-xs font-black uppercase tracking-wide text-slate-500">Current Ayah<select className="input mt-1 w-full" value={edit.current_ayah} onChange={e=>setEdit({...edit,current_ayah:Number(e.target.value)})}>{Array.from({length:SURAHS.find(x=>x.id===Number(edit.current_surah))?.ayahs||286},(_,i)=>i+1).map(n=><option key={n} value={n}>{n}</option>)}</select></label></div>'''
          if old_modal not in text:
              raise SystemExit('Expected Quran edit modal not found')
          text = text.replace(old_modal, new_modal, 1)

          path.write_text(text, encoding='utf-8')

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit repaired source and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/teacher/students/page.tsx
          git commit -m "Fix teacher student Quran editor [teacher-quran-ui-fix]" || true
          git push
          git rm .github/workflows/repair-teacher-students-quran-editor.yml
          git commit -m "Remove temporary teacher Quran repair workflow [teacher-quran-ui-fix]"
          git push
