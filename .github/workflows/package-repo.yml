name: Package repository
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  package:
    if: github.event.head_commit.message != 'Record package artifact' && github.event.head_commit.message != 'Remove packaging helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create package
        run: git archive --format=zip --output=quran-school-management-main.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: quran-school-management-main
          path: quran-school-management-main.zip
      - name: Record artifact details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts --paginate --jq '.artifacts[] | select(.name=="quran-school-management-main") | .id' | head -n 1)
          printf 'ARTIFACT_ID=%s\nRUN_ID=%s\nCOMMIT=%s\n' "$ARTIFACT_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > PACKAGE_ARTIFACT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PACKAGE_ARTIFACT.txt
          git commit -m "Record package artifact"
          git push
